name: graylog
type: server
title: Graylog
description: Graylog SIEM log search, streams, and alert/event queries for SOC workflows.
image: ghcr.io/gabrielbelli/graylog-mcp:latest
icon: https://avatars.githubusercontent.com/u/474892
readme: https://raw.githubusercontent.com/gabrielbelli/bluearmory/master/graylog-mcp/README.md
config:
  - name: graylog
    description: Connection to your Graylog instance
    type: object
    properties:
      url:
        type: string
        description: Base URL of the Graylog server (e.g. https://graylog.example.com:9000)
    required:
      - url
env:
  - name: GRAYLOG_URL
    value: "{{graylog.url}}"
secrets:
  - name: graylog.api_token
    env: GRAYLOG_API_TOKEN
    example: 1a2b3c4d5e6f...
tools:
  - name: graylog_search_relative
  - name: graylog_search_absolute
  - name: graylog_search_keyword
  - name: graylog_get_message
  - name: graylog_list_streams
  - name: graylog_get_stream
  - name: graylog_search_events
  - name: graylog_list_event_definitions
  - name: graylog_system_overview
  - name: graylog_list_inputs
metadata:
  category: monitoring
  tags:
    - siem
    - logs
    - blue-team
    - soc
  license: MIT
  owner: gabrielbelli
